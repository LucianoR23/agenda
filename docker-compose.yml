# Local development databases. The app itself runs with `pnpm dev`.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda
      TZ: America/Buenos_Aires
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda"]
      interval: 2s
      retries: 20

  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda_test
      TZ: America/Buenos_Aires
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
