# Local Postgres for development and tests. The app itself runs with `pnpm dev`.
# Same image as production (postgres-core in Coolify). Databases: agenda_dev, agenda_test, agenda_e2e_test.
services:
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda_dev
      TZ: America/Buenos_Aires
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda_dev"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
