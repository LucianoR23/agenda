        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        updatedBy:
          $ref: "#/components/schemas/ItemSource"
        reminder:
          $ref: "#/components/schemas/Reminder"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/AgendaEvent"
          description: "Only for a task with a time (`dueAt`): the timed events happening at that moment. Mention them to Lemy."
      required:
        - id
