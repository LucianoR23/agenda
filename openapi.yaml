    TaskCreated:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        listId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        notes:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          anyOf:
            - allOf:
                - $ref: "#/components/schemas/LocalDate"
                - description: Calendar date in the user's timezone, `YYYY-MM-DD`.
            - type: "null"
        dueTime:
          anyOf:
            - $ref: "#/components/schemas/LocalTime"
            - type: "null"
          description: Local time in the user's timezone; only with dueDate.
        dueAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: dueDate + dueTime as an instant (null without a time).
        whenText:
          type:
            - string
            - "null"
          description: 'When, in Spanish, ready to say: "jueves 14 de noviembre, 09:00". The year only when it is not this year.'
          example: jueves 14 de noviembre, 09:00
        overdue:
          type: boolean
          description: Open and due before today (user's timezone).
        rrule:
          type:
            - string
            - "null"
          maxLength: 300
          description: RFC 5545 RRULE body without DTSTART (the due date is the start).
          example: FREQ=WEEKLY;BYDAY=MO
        seriesId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: Shared by every occurrence of a recurring task.
        completedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        sortOrder:
          type: integer
        tags:
          type: array
          items:
            type: string
        source:
          $ref: "#/components/schemas/ItemSource"
        url:
          type: string
          format: uri
          description: Opens it in the agenda app.
        version:
