          example: jueves 14 de noviembre, 09:00
        overdue:
          type: boolean
          description: Open and due before today (user's timezone).
        rrule:
          type:
            - string
            - "null"
          maxLength: 300
          description: RFC 5545 RRULE body without DTSTART (the due date is the start).
          example: FREQ=WEEKLY;BYDAY=MO
        seriesId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
