          maxLength: 64
        newPin:
          $ref: "#/components/schemas/Pin"
        deviceName:
          type: string
          maxLength: 80
      required:
        - method
        - code
        - newPin
      additionalProperties: false
    RecoverResult:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"
        remainingRecoveryCodes:
          type: integer
      required:
        - device
        - remainingRecoveryCodes
      additionalProperties: false
    RecoveryCodes:
      type: object
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
            pattern: ^[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$
          description: Shown once. Single use each.
      required:
        - recoveryCodes
      additionalProperties: false
    ReorderInput:
      type: object
      properties:
        ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          minItems: 1
          maxItems: 80
          description: Agent/user block ids of one option, in the new order. Calendar blocks → 409 `calendar_owned`.
        version:
          type: integer
          minimum: 1
          description: Expected current version. Alternative to the `If-Match` header; mismatch → 409 `version_conflict`.
      required:
        - ids
      additionalProperties: false
    Review:
      type: object
      properties:
        energy:
          type: integer
          minimum: 1
          maximum: 5
        mood:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type:
            - string
            - "null"
          maxLength: 4000
      required:
        - energy
        - mood
      additionalProperties: false
      description: End-of-day review.
    ScheduleField:
      type: string
      enum:
        - start
        - end
        - title
        - type
        - detail
        - lead
        - order
    SessionState:
      type: object
      properties:
        state:
          type: string
          enum:
            - setup_required
            - unauthenticated
            - locked
            - unlocked
          description: "`setup_required`: no user yet. `unauthenticated`: unknown/revoked device. `locked`: known device unused for more than PIN_REAUTH_DAYS. `unlocked`: session valid."
        passkeyEnabled:
          type: boolean
          description: This device has a fingerprint passkey.
        lockedUntil:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: Set while PIN entry is locked out.
        device:
          type:
            - object
            - "null"
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            name:
              type: string
          required:
            - id
            - name
          additionalProperties: false
        vapidPublicKey:
          type:
            - string
            - "null"
          description: Web Push application server key; null when push is not configured.
      required:
        - state
        - passkeyEnabled
        - lockedUntil
        - device
        - vapidPublicKey
      additionalProperties: false
    SetupInput:
      type: object
      properties:
        setupCode:
          type: string
          minLength: 1
          maxLength: 200
        pin:
          $ref: "#/components/schemas/Pin"
        deviceName:
          type: string
          maxLength: 80
      required:
        - setupCode
        - pin
      additionalProperties: false
    SetupResult:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"
        recoveryCodes:
          type: array
          items:
            type: string
            pattern: ^[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$
          description: Shown once. Single use each.
      required:
        - device
        - recoveryCodes
      additionalProperties: false
    ShiftInput:
      type: object
      properties:
        fromTime:
          allOf:
            - $ref: "#/components/schemas/BlockTime"
            - description: Shift blocks starting at or after this time.
              example: 21:00
        minutes:
          type: integer
          minimum: -240
          maximum: 240
          example: 30
        version:
          type: integer
          minimum: 1
          description: Expected current version. Alternative to the `If-Match` header; mismatch → 409 `version_conflict`.
      required:
        - fromTime
        - minutes
      additionalProperties: false
      description: '"Me atrasé": shifts my pending, unlocked agent/user blocks of the chosen option (including `sleep`). Calendar blocks are untouched. Blocks may move past midnight (`24:15`); nothing is lost and the shift is recorded as a `shift` ChangeLog entry and webhook change. 422 `shift_out_of_range` only if a start would leave 00:00–29:59.'
    SleepEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - bed
            - wake
          description: '`bed` = "Me voy a dormir", `wake` = "Me levanté".'
        at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
            - description: 'Default: now. Lets me (or the agent) back-date: "me dormí a las 00:20".'
      required:
        - type
      additionalProperties: false
      description: "Quick button / agent shortcut. The night is resolved from the time: before 12:00 → the previous day's night, otherwise today's."
    SleepLog:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        date:
          allOf:
            - $ref: "#/components/schemas/LocalDate"
            - description: The night that starts on this day (bed on this date's evening or after midnight).
        bedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: When I actually went to bed.
        bedSource:
          anyOf:
            - $ref: "#/components/schemas/SleepSource"
            - type: "null"
        wokeAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: When I actually got up.
        wakeSource:
          anyOf:
            - $ref: "#/components/schemas/SleepSource"
            - type: "null"
        durationMinutes:
          type:
            - integer
            - "null"
          description: wokeAt − bedAt, when both are set.
        plannedStart:
          anyOf:
            - $ref: "#/components/schemas/BlockTime"
            - type: "null"
          description: Start of the `sleep` block in the chosen option, if any.
        plannedEnd:
          anyOf:
            - $ref: "#/components/schemas/BlockTime"
            - type: "null"
        bedDelayMinutes:
          type:
            - integer
            - "null"
          description: bedAt − planned start (positive = later than planned).
        note:
          type:
            - string
            - "null"
        version:
          type: integer
          minimum: 1
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        updatedBy:
          $ref: "#/components/schemas/Actor"
      required:
        - id
        - date
        - bedAt
        - bedSource
        - wokeAt
        - wakeSource
        - durationMinutes
        - plannedStart
        - plannedEnd
        - bedDelayMinutes
        - note
        - version
        - createdAt
        - updatedAt
        - updatedBy
      additionalProperties: false
      description: Actual sleep for one night. Setting `bedAt` also marks that day's pending `sleep` block as done. The agent may only fill a half (bed / wake) that is still empty.
    SleepSource:
      type: string
      enum:
        - agent
        - user
    SleepUpsert:
      type: object
      properties:
        bedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        wokeAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        note:
          type:
            - string
            - "null"
          maxLength: 1000
        version:
          type: integer
          minimum: 1
          description: Expected current version. Alternative to the `If-Match` header; mismatch → 409 `version_conflict`.
      additionalProperties: false
      description: Manual load or correction. Times may not be in the future; the night lasts < 20 h.
    Task:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        date:
          $ref: "#/components/schemas/LocalDate"
        title:
          type: string
        kind:
          $ref: "#/components/schemas/TaskKind"
        origin:
          $ref: "#/components/schemas/TaskOrigin"
        done:
          type: boolean
        doneAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        relatedBlockId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        order:
          type: integer
        version:
          type: integer
          minimum: 1
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        updatedBy:
          $ref: "#/components/schemas/Actor"
      required:
        - id
        - date
        - title
        - kind
        - origin
        - done
        - doneAt
        - relatedBlockId
        - order
        - version
        - createdAt
        - updatedAt
        - updatedBy
      additionalProperties: false
    TaskCreate:
      type: object
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
            - description: Client-generated UUIDv7 (offline creates).
        date:
          $ref: "#/components/schemas/LocalDate"
        title:
          type: string
          minLength: 1
          maxLength: 500
        kind:
          $ref: "#/components/schemas/TaskKind"
        relatedBlockId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        order:
          type: integer
          minimum: 0
      required:
        - date
        - title
      additionalProperties: false
    TaskKind:
      type: string
      enum:
        - whatsapp_confirm
        - lead_context
        - follow_up
        - other
    TaskOrigin:
      type: string
      enum:
        - agent
        - user
    TaskPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        kind:
          $ref: "#/components/schemas/TaskKind"
        done:
          type: boolean
        relatedBlockId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        order:
          type: integer
          minimum: 0
        date:
          allOf:
            - $ref: "#/components/schemas/LocalDate"
            - description: Move the task to another day.
        version:
          type: integer
          minimum: 1
          description: Expected current version. Alternative to the `If-Match` header; mismatch → 409 `version_conflict`.
      additionalProperties: false
      description: The agent cannot edit or delete my tasks (origin=user) except marking them done while not done.
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 timestamp with offset (the API always answers in -03:00).
      example: 2026-10-19T07:00:12.345-03:00
    UnlockInput:
      type: object
      properties:
        pin:
          $ref: "#/components/schemas/Pin"
        deviceName:
          type: string
          maxLength: 80
      required:
        - pin
      additionalProperties: false
    UnlockResult:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"
      required:
        - device
      additionalProperties: false
    Uuid:
      type: string
      format: uuid
      example: 019a0a6e-5c3e-7b2a-9d41-3f0c8a1b2c3d
    WebAuthnJson:
      type: object
      additionalProperties: {}
      description: "`PublicKeyCredential*OptionsJSON` or `*ResponseJSON` from @simplewebauthn (opaque here)."
    WebhookChange:
      type: object
      properties:
        entity:
          type: string
          enum:
            - day
            - block
            - task
            - habit_log
            - proposal
            - sleep_log
        id:
          $ref: "#/components/schemas/Uuid"
        action:
          $ref: "#/components/schemas/ChangeAction"
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              from: {}
              to: {}
            additionalProperties: false
        block:
          type: object
          properties:
            title:
              type: string
            type:
              $ref: "#/components/schemas/BlockType"
            start:
              $ref: "#/components/schemas/BlockTime"
            externalId:
              type:
                - string
                - "null"
            outcome:
              anyOf:
                - $ref: "#/components/schemas/CallOutcome"
                - type: "null"
          required:
            - title
            - type
            - start
            - externalId
          additionalProperties: false
        task:
          type: object
          properties:
            title:
              type: string
            kind:
              $ref: "#/components/schemas/TaskKind"
          required:
            - title
            - kind
          additionalProperties: false
        habit:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
          required:
            - slug
            - name
          additionalProperties: false
        shift:
          type: object
          properties:
            fromTime:
              $ref: "#/components/schemas/BlockTime"
            minutes:
              type: integer
            blocks:
              type: array
              items:
                type: object
                properties:
                  id:
                    $ref: "#/components/schemas/Uuid"
                  title:
                    type: string
                  from:
                    $ref: "#/components/schemas/BlockTime"
                  to:
                    $ref: "#/components/schemas/BlockTime"
                required:
                  - id
                  - title
                  - from
                  - to
                additionalProperties: false
          required:
            - fromTime
            - minutes
            - blocks
          additionalProperties: false
          description: 'On `action: shift` ("Me atrasé").'
        sleep:
          type: object
          properties:
            night:
              $ref: "#/components/schemas/LocalDate"
            bedAt:
              anyOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            wokeAt:
              anyOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
          required:
            - night
            - bedAt
            - wokeAt
          additionalProperties: false
        at:
          $ref: "#/components/schemas/Timestamp"
      required:
        - entity
        - id
        - action
        - at
      additionalProperties: false
    WebhookPayload:
      type: object
      properties:
        event:
          type: string
          enum:
            - day.updated_by_user
        batchId:
          $ref: "#/components/schemas/Uuid"
        date:
          $ref: "#/components/schemas/LocalDate"
        dayVersion:
          type: integer
        changes:
          type: array
          items:
            $ref: "#/components/schemas/WebhookChange"
          minItems: 1
        summary:
          type: object
          properties:
            blocksDone:
              type: integer
            blocksTotal:
              type: integer
            weeklyGym:
              anyOf:
                - $ref: "#/components/schemas/WeeklyGym"
                - type: "null"
          required:
            - blocksDone
            - blocksTotal
            - weeklyGym
          additionalProperties: false
        dayUrl:
          type: string
          format: uri
      required:
        - event
        - batchId
        - date
        - dayVersion
        - changes
        - summary
        - dayUrl
      additionalProperties: false
    WebhookStatus:
      type: object
      properties:
        configured:
          type: boolean
        lastDelivery:
          type:
            - object
            - "null"
          properties:
            batchId:
              $ref: "#/components/schemas/Uuid"
            date:
              $ref: "#/components/schemas/LocalDate"
            status:
              type: string
              enum:
                - collecting
                - pending
                - sent
                - failed
            attempts:
              type: integer
            lastAttemptAt:
              anyOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            lastResponseStatus:
              type:
                - integer
                - "null"
            lastError:
              type:
                - string
                - "null"
            sentAt:
              anyOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
          required:
            - batchId
            - date
            - status
            - attempts
            - lastAttemptAt
            - lastResponseStatus
            - lastError
            - sentAt
          additionalProperties: false
        queued:
          type: integer
          description: Batches collecting or waiting for (re)delivery.
        failedLast7Days:
          type: integer
      required:
        - configured
        - lastDelivery
        - queued
        - failedLast7Days
      additionalProperties: false
    WeeklyGym:
      type: object
      properties:
        done:
          type: integer
          minimum: 0
          maximum: 14
        target:
          type: integer
          minimum: 1
          maximum: 14
      required:
        - done
        - target
      additionalProperties: false
      description: Gym sessions this week as reported by the agent.
  parameters:
    IdempotencyKey:
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
      required: false
      description: Same key + same body → stored response replayed; different body → 422. Kept 48 h, scoped per actor.
      name: Idempotency-Key
      in: header
    IfMatch:
      schema:
        $ref: "#/components/schemas/IfMatch"
      required: false
      description: Expected `version` as ETag (`"7"`). Mismatch → 409 `version_conflict` with the current resource.
      name: If-Match
      in: header
paths:
  /api/days/{date}:
    post:
      operationId: createOwnDay
      tags:
        - Days
      summary: '"Armar mi día": create my own day (user)'
      description: |-
        Creates the day with one empty option `A` ("Mi día"), already `chosen`, so I can add blocks before Agenbot loads it. A later agent `PUT` becomes a proposal. 409 if the day exists.

        **Actors:** user.
      security:
        - session: []
      x-actors:
        - user
      parameters:
        - schema:
            $ref: "#/components/schemas/LocalDate"
          required: true
          description: Local date in America/Buenos_Aires, `YYYY-MM-DD`.
          name: date
          in: path
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              own:
                summary: 06:40 — Agenbot no cargó todavía; armo mi día
                value: {}
            schema:
              $ref: "#/components/schemas/CreateOwnDayInput"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              description: Current `version` as a strong ETag, e.g. `"7"`.
              schema:
                type: string
          content:
            application/json:
              examples:
                own:
                  summary: 06:40 — Agenbot no cargó todavía; armo mi día
                  value:
                    id: 019a0a6e-1c00-7000-8000-000000000032
                    date: 2026-10-20
                    status: chosen
                    chosenOptionId: 019a0a6e-1c00-7000-8000-000000000033
                    chosenOption: A
                    notes: null
                    callsSummary: null
                    weeklyGym: null
                    review: null
                    reviewedAt: null
                    closedAt: null
                    options:
                      - id: 019a0a6e-1c00-7000-8000-000000000033
                        label: A
                        title: Mi día
                        description: null
                        order: 0
                        blocks: []
                        version: 1
                        createdAt: 2026-10-20T06:40:00.000-03:00
                        updatedAt: 2026-10-20T06:40:00.000-03:00
                        updatedBy: user
                    tasks: []
                    habitLogs: []
                    pendingProposal: null
                    sleep:
                      night: null
                      previousNight:
                        id: 019a0a6e-1c00-7000-8000-00000000015f
                        date: 2026-10-19
                        bedAt: 2026-10-20T00:20:00.000-03:00
                        bedSource: user
                        wokeAt: null
                        wakeSource: null
                        durationMinutes: null
                        plannedStart: 23:30
                        plannedEnd: 07:00
                        bedDelayMinutes: 50
                        note: null
                        version: 1
                        createdAt: 2026-10-20T00:20:00.000-03:00
                        updatedAt: 2026-10-20T00:20:00.000-03:00
                        updatedBy: user
                    version: 1
                    createdAt: 2026-10-20T06:40:00.000-03:00
                    updatedAt: 2026-10-20T06:40:00.000-03:00
                    updatedBy: user
              schema:
                $ref: "#/components/schemas/Day"
        "400":
          description: "`validation_error`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "`unauthorized` (no/invalid credentials) or `device_locked` (unlock with PIN)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "`forbidden`: user only."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`invalid_transition`: the day already exists. `idempotency_in_progress`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`idempotency_key_reuse`: same `Idempotency-Key`, different body."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getDay
      tags:
        - Days
      summary: Get a full day
      description: |-
        Options with blocks, tasks, habit logs and the pending proposal. Reading a past day that is not `closed` closes it first (lazy close).

        **Actors:** agent, user.
      security:
        - agentBearer: []
        - session: []
      x-actors:
        - agent
        - user
      parameters:
        - schema:
            $ref: "#/components/schemas/LocalDate"
          required: true
          description: Local date in America/Buenos_Aires, `YYYY-MM-DD`.
          name: date
          in: path
      responses:
        "200":
          description: The day.
          headers:
            ETag:
              description: Current `version` as a strong ETag, e.g. `"7"`.
              schema:
                type: string
          content:
            application/json:
              examples:
                draft:
                  summary: 07:01 — draft with options A and B
                  value:
                    id: 019a0a6e-1c00-7000-8000-000000000001
                    date: 2026-10-19
