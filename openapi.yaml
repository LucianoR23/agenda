      summary: Push notification at a moment
      description: |-
        `fireAt` in the future, with or without offset (without = the user's local time). Optional RRULE (hourly to yearly), `urgent` (ignores quiet hours) and `taskId` (Listo also completes the task).

        A push notification at a moment ('recordame a las 18 sacar la ropa'). `fireAt` can omit the offset: it's Lemy's local time. Must be in the future. `rrule` for repeating ones (`FREQ=DAILY`), `urgent` to ignore quiet hours. Always send a `clientId`.

        **Actors:** user, API token with `write`.
      security:
        - session: []
        - apiToken:
            - write
      x-actors:
        - user
        - API token with `write`
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
