                            updatedAt: 2026-10-19T07:00:04.812-03:00
                            updatedBy: agent
                          - id: 019a0a6e-1c00-7000-8000-000000000069
                            optionId: 019a0a6e-1c00-7000-8000-000000000002
                            start: 08:00
                            end: 08:30
                            title: Desayuno
                            type: meal
                            detail: null
