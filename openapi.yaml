        "400":
          description: "`validation_error`."
          content:
            application/problem+json:
              examples:
                invalid:
                  summary: Validation error (calendar block without externalId, bad time)
                  value:
                    type: https://agenda.lemydev.com/problems/validation_error
                    title: Request validation failed
                    status: 400
                    detail: 2 validation errors.
                    code: validation_error
                    requestId: req_01JA9X7Q2M8K
                    errors:
                      - path: /options/0/blocks/0/start
                        message: Expected HH:mm (00:00–23:59)
                      - path: /options/0/blocks/0/externalId
                        message: Required when source is calendar
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "`unauthorized` (no/invalid credentials) or `device_locked` (unlock with PIN)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "`forbidden`: agent only."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`day_closed` or `version_conflict` (when `If-Match` is sent). `idempotency_in_progress`."
          content:
            application/problem+json:
              examples:
                closed:
                  summary: Writing a closed day
                  value:
                    type: https://agenda.lemydev.com/problems/day_closed
                    title: Day is closed
                    status: 409
                    detail: 2026-10-18 is closed; the agent cannot modify it.
                    code: day_closed
                    requestId: req_01JA9X7Q2M8K
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`idempotency_key_reuse`: same `Idempotency-Key`, different body."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "`rate_limited` (agent: 120 req/min)."
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: patchDay
      tags:
        - Days
      summary: Update day fields
      description: |-
        `notes`, `callsSummary`, `weeklyGym`, `review`; `status: closed` (user only) closes the day early.

        **Actors:** agent, user.
      security:
        - agentBearer: []
        - session: []
      x-actors:
        - agent
        - user
      parameters:
        - schema:
            $ref: "#/components/schemas/LocalDate"
          required: true
          description: Local date in America/Buenos_Aires, `YYYY-MM-DD`.
          name: date
          in: path
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              review:
                summary: 22:40 — I fill the end-of-day review
                value:
                  review:
                    energy: 4
                    mood: 4
                    text: Buen día. Martín pide hablar con la pareja; Laura cerró follow-up.
              conflict:
                summary: Stale version
                value:
                  callsSummary: Martín → follow-up jueves.
                  version: 3
            schema:
              $ref: "#/components/schemas/DayPatch"
