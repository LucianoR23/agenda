    post:
      operationId: unlock
      tags:
        - Auth
      summary: Unlock / log in with PIN
      description: |-
        Trusts a new device or re-unlocks a locked one. 5 failures → locked 15 min, doubling per lockout (cap 24 h), per device and globally.

        **Actors:** anyone (device-key cookie).
      security: []
      x-actors:
        - anyone (device-key cookie)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              ok:
                summary: Correct PIN
                value:
                  pin: "482913"
              wrong:
                summary: Wrong PIN
                value:
                  pin: "111111"
              lockedOut:
                summary: 5th failure
                value:
                  pin: "222222"
            schema:
              $ref: "#/components/schemas/UnlockInput"
      responses:
        "200":
          description: Unlocked.
          headers:
            Set-Cookie:
              description: "`agenda_session` (httpOnly, Secure, SameSite=Lax)."
              schema:
                type: string
          content:
            application/json:
              examples:
                ok:
                  summary: Correct PIN
                  value:
                    device:
                      id: 019a0a6e-1c00-7000-8000-000000000320
                      name: Galaxy S26 Ultra · Chrome
                      userAgent: Mozilla/5.0 (Linux; Android 16; SM-S948B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Mobile Safari/537.36
                      current: true
                      passkeyEnabled: true
                      createdAt: 2026-10-01T09:12:00.000-03:00
                      lastSeenAt: 2026-10-19T07:41:30.000-03:00
                      lastUnlockAt: 2026-10-19T07:41:30.000-03:00
              schema:
                $ref: "#/components/schemas/UnlockResult"
        "400":
          description: "`validation_error`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "`invalid_credentials` with `remainingAttempts`."
          content:
            application/problem+json:
              examples:
                wrong:
                  summary: Wrong PIN
                  value:
                    type: https://agenda.lemydev.com/problems/invalid_credentials
                    title: Invalid credentials
                    status: 401
                    detail: Wrong PIN.
                    code: invalid_credentials
                    requestId: req_01JA9X7Q2M8K
                    remainingAttempts: 3
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`idempotency_in_progress`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`idempotency_key_reuse`: same `Idempotency-Key`, different body."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "`locked_out` with `retryAfterSeconds`."
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/problem+json:
