  /api/days/{date}/shift:
    post:
      operationId: shiftDay
      tags:
        - Days
      summary: '"Me atrasé": shift my pending blocks'
      description: |-
        Moves pending, unlocked `agent`/`user` blocks of the chosen option starting at or after `fromTime`, `sleep` included; calendar blocks never move. Blocks can pass midnight (`24:15` = 00:15 next day). When I shift, `start`/`end` join `userOverrides`. Recorded as a `shift` ChangeLog entry and a `shift` webhook change.

        **Actors:** agent, user.
      security:
        - agentBearer: []
        - session: []
      x-actors:
        - agent
        - user
      parameters:
        - schema:
            $ref: "#/components/schemas/LocalDate"
          required: true
          description: Local date in America/Buenos_Aires, `YYYY-MM-DD`.
          name: date
          in: path
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              plus30:
                summary: 11:04 — +30 min from 11:00
                value:
                  fromTime: 11:00
                  minutes: 30
              pastMidnight:
                summary: "21:20 — +45 from 21:00: pareja 22:30, dormir pasa a 24:15 (00:15 del martes); pádel (calendar) no se mueve"
                value:
                  fromTime: 21:00
                  minutes: 45
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "200":
          description: Updated day.
          headers:
            ETag:
              description: Current `version` as a strong ETag, e.g. `"7"`.
              schema:
                type: string
          content:
            application/json:
