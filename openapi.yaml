                          to: 11:15
                        end:
                          from: 11:30
                          to: 11:45
                      block:
                        title: Lectura (30 min)
                        type: reading
                        start: 11:15
                        externalId: null
                      at: 2026-10-19T10:50:12.000-03:00
                  summary:
                    blocksDone: 1
                    blocksTotal: 12
                    weeklyGym:
                      done: 0
                      target: 3
                  dayUrl: https://agenda.lemydev.com/api/days/2026-10-19
              shiftAndSleep:
