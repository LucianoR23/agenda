      additionalProperties: false
    SyncInput:
      type: object
      properties:
        ifOlderThanSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Only sync when the last sync is older than this (the app sends 120 on open). Omit to force.
      additionalProperties: false
    Task:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        listId:
          $ref: "#/components/schemas/Uuid"
        title:
