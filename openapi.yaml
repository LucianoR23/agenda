        completedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        sortOrder:
          type: integer
        tags:
          type: array
          items:
            type: string
        source:
          $ref: "#/components/schemas/ItemSource"
        url:
          type: string
          format: uri
          description: Opens it in the agenda app.
        version:
          type: integer
          minimum: 1
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        updatedBy:
          $ref: "#/components/schemas/ItemSource"
      required:
        - id
