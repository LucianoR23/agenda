                  title: Resumen del día
                  body: "Hiciste 6 de 8 tareas y marcaste Gym. Mañana: dentista 10:00."
                  tag: resumen-noche
              badUrl:
                summary: Link outside the allowed sites
                value:
                  title: Mirá esto
