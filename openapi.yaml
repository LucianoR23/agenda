        "400":
          description: "`validation_error`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "`unauthorized` (no/invalid credentials) or `device_locked` (unlock with PIN)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "`forbidden`: only I can close a day early."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "`day_not_found`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`version_conflict`, `user_edit_conflict` (agent writing my review), `day_closed` (agent). `idempotency_in_progress`."
          content:
            application/problem+json:
              examples:
                conflict:
                  summary: Stale version
                  value:
                    type: https://agenda.lemydev.com/problems/version_conflict
                    title: Version conflict
                    status: 409
                    detail: Expected version 3, current is 5.
                    code: version_conflict
                    requestId: req_01JA9X7Q2M8K
                    current:
                      version: 5
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`idempotency_key_reuse`: same `Idempotency-Key`, different body."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "`rate_limited` (agent: 120 req/min)."
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/days/{date}/choose:
    post:
      operationId: chooseOption
      tags:
        - Days
      summary: Choose a plan option
      description: |-
        Allowed while `draft` or `chosen` (switching). `edited` / `closed` → 409. Sends the webhook immediately.

        **Actors:** agent, user.
      security:
        - agentBearer: []
        - session: []
      x-actors:
        - agent
        - user
      parameters:
        - schema:
            $ref: "#/components/schemas/LocalDate"
          required: true
          description: Local date in America/Buenos_Aires, `YYYY-MM-DD`.
          name: date
          in: path
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              chooseA:
                summary: 07:42 — I choose option A
                value:
                  option: A
                  version: 1
              edited:
                summary: Switching option after editing
                value:
                  option: B
            schema:
              $ref: "#/components/schemas/ChooseInput"
      responses:
        "200":
          description: "Day with `status: chosen`."
          headers:
            ETag:
              description: Current `version` as a strong ETag, e.g. `"7"`.
              schema:
                type: string
          content:
            application/json:
              examples:
