          minLength: 1
          maxLength: 500
        notes:
          type: string
          maxLength: 10000
        listId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
            - description: "Default: Inbox."
        list:
          type: string
          minLength: 1
          maxLength: 100
          description: "List by name instead of listId (case and accents don't matter). Must exist: listTaskLists shows them."
