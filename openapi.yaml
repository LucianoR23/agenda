webhooks:
  dayUpdatedByUser:
    post:
      operationId: dayUpdatedByUser
      tags:
        - Webhook
      summary: "Outbound: my changes, sent to Agenbot"
      security:
        - agentWebhookToken: []
      description: "`POST ${AGENT_WEBHOOK_URL}` with `Authorization: Bearer ${AGENT_WEBHOOK_TOKEN}` and `Idempotency-Key: <batchId>`. Only changes made by me (never the agent's). Debounced per day: sent after `WEBHOOK_DEBOUNCE_SECONDS` (120) without new changes, or immediately for `choose` and proposal accept/reject. Retried with exponential backoff, 5 attempts. Any 2xx = delivered."
      requestBody:
        content:
          application/json:
            examples:
              afterCall:
                summary: Martín's call done + reading moved
                value:
                  event: day.updated_by_user
                  batchId: 019a0a6e-1c00-7000-8000-000000000384
                  date: 2026-10-19
                  dayVersion: 4
                  changes:
                    - entity: block
