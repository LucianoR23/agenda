        - title
        - notes
        - status
        - priority
        - dueDate
        - dueTime
        - dueAt
        - whenText
        - overdue
        - rrule
        - seriesId
        - completedAt
        - sortOrder
        - tags
        - source
        - url
        - version
        - createdAt
        - updatedAt
        - updatedBy
      additionalProperties: false
      description: A Task, plus the reminder when `reminderAt` was sent.
    TaskList:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        color:
          type:
            - string
            - "null"
        icon:
          type:
            - string
            - "null"
        sortOrder:
          type: integer
        isInbox:
          type: boolean
          description: The default list. Exactly one; can't be deleted.
        openCount:
          type: integer
          description: Open tasks in the list.
        version:
          type: integer
          minimum: 1
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        updatedBy:
          $ref: "#/components/schemas/ItemSource"
      required:
        - id
        - name
        - color
        - icon
        - sortOrder
        - isInbox
        - openCount
        - version
        - createdAt
        - updatedAt
        - updatedBy
      additionalProperties: false
    TaskListCreate:
      type: object
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
            - description: Client-generated id (offline creates).
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          example: "#7ccfa5"
        icon:
          type: string
          maxLength: 40
      required:
        - name
      additionalProperties: false
    TaskListPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type:
            - string
            - "null"
          pattern: ^#[0-9a-fA-F]{6}$
          example: "#7ccfa5"
        icon:
          type:
            - string
            - "null"
          maxLength: 40
        sortOrder:
          type: integer
        version:
          type: integer
          minimum: 1
          description: Expected current version. Alternative to the `If-Match` header; mismatch → 409 `VERSION_CONFLICT`.
      additionalProperties: false
    TaskPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        notes:
          type:
            - string
            - "null"
          maxLength: 10000
        listId:
          $ref: "#/components/schemas/Uuid"
        list:
          type: string
          minLength: 1
          maxLength: 100
          description: "List by name instead of listId (case and accents don't matter). Must exist: listTaskLists shows them."
          example: Casa
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          anyOf:
            - allOf:
                - $ref: "#/components/schemas/LocalDate"
                - description: Calendar date in the user's timezone, `YYYY-MM-DD`.
            - $ref: "#/components/schemas/DateTimeInput"
            - type: "null"
          description: null removes the date (and the time and recurrence).
        dueTime:
          anyOf:
            - $ref: "#/components/schemas/LocalTime"
            - type: "null"
        rrule:
          type:
            - string
            - "null"
          maxLength: 300
          description: RFC 5545 RRULE body without DTSTART (the due date is the start).
          example: FREQ=WEEKLY;BYDAY=MO
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
            pattern: ^[^\s#]+$
          maxItems: 20
        status:
          type: string
          enum:
            - open
            - cancelled
          description: Use completeTask to mark done.
        version:
          type: integer
          minimum: 1
          description: Expected current version. Alternative to the `If-Match` header; mismatch → 409 `VERSION_CONFLICT`.
      additionalProperties: false
    TaskStatus:
      type: string
      enum:
        - open
        - done
        - cancelled
    TaskView:
      type: string
      enum:
        - inbox
        - today
        - upcoming
        - overdue
        - done
        - all
      description: "`inbox`: open, no date, in the Inbox. `today`: open, due today. `upcoming`: open, due after today. `overdue`: open, due before today. `done`: completed, newest first. `all`: no view filter."
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 timestamp with offset .
      example: 2026-10-19T07:00:12.345-03:00
    TokenCreated:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        prefix:
          type: string
          description: First 8 characters, for recognising the token.
          example: agd_x7Kp
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/TokenScope"
        lastUsedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        lastUsedIp:
          type:
            - string
            - "null"
        expiresAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        token:
          type: string
          description: The secret (`agd_…`). Shown only in this response.
          example: agd_x7Kp…
      required:
        - id
        - name
        - prefix
        - scopes
        - lastUsedAt
        - lastUsedIp
        - expiresAt
        - createdAt
        - token
      additionalProperties: false
    TokenCreateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/TokenScope"
          minItems: 1
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - name
        - scopes
      additionalProperties: false
    TokenScope:
      type: string
      enum:
        - read
        - write
        - notify
      description: "`read`: query the agenda. `write`: create/change items. `notify`: send pushes."
    UnlockInput:
      type: object
      properties:
        pin:
          $ref: "#/components/schemas/Pin"
        deviceName:
          type: string
          maxLength: 80
      required:
        - pin
      additionalProperties: false
    UnlockResult:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"
      required:
        - device
      additionalProperties: false
    Uuid:
      type: string
      format: uuid
      example: 019a0a6e-5c3e-7b2a-9d41-3f0c8a1b2c3d
    WebAuthnJson:
      type: object
      additionalProperties: {}
      description: "`PublicKeyCredential*OptionsJSON` or `*ResponseJSON` from @simplewebauthn (opaque here)."
  parameters:
    IdempotencyKey:
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
      required: false
      description: Same key + same body → stored response replayed; different body → 422. Kept 24 h, scoped per caller.
      name: Idempotency-Key
      in: header
    IfMatch:
      schema:
        $ref: "#/components/schemas/IfMatch"
      required: false
      description: Expected `version` as ETag (`"7"`). Mismatch → 409 `VERSION_CONFLICT` with the current resource.
      name: If-Match
      in: header
paths:
  /api/health:
    get:
      operationId: health
      tags:
        - Ops
      summary: Liveness/readiness (checks the DB)
      description: "**Actors:** anyone."
      security: []
      x-actors:
        - anyone
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              examples:
                ok:
                  summary: Healthy
                  value:
                    status: ok
                    db: ok
                    version: 0.1.0+a6ebbf4
                    time: 2026-10-19T07:00:00.000-03:00
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: DB unreachable.
          content:
            application/json:
              examples:
                down:
                  summary: DB down
                  value:
                    status: degraded
                    db: down
                    version: 0.1.0+a6ebbf4
                    time: 2026-10-19T07:00:00.000-03:00
              schema:
                $ref: "#/components/schemas/Health"
  /api/openapi.json:
    get:
      operationId: openapi
      tags:
        - Ops
      summary: This OpenAPI document
      description: |-
        Compact by default (no examples, ~115 KB). `?examples=true` returns the full document (~320 KB), identical to `openapi.yaml`.

        **Actors:** anyone.
      security: []
      x-actors:
        - anyone
      parameters:
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: examples
          in: query
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/json:
              examples:
                doc:
                  summary: The contract
                  value:
                    openapi: 3.1.0
                    info:
                      title: Agenda API
                      version: 1.0.0
              schema:
                type: object
                additionalProperties: {}
        "400":
          description: "`VALIDATION_ERROR` (details.fields)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/openapi.sunday.json:
    get:
      operationId: openapiSunday
      tags:
        - Ops
      summary: Sunday's tools (OpenAPI subset)
      description: |-
        Only the operations tagged `sunday`, token auth only, no header parameters or examples. Open WebUI loads this URL as a tool server (Bearer = the "sunday" API token).

        **Actors:** anyone.
      security: []
      x-actors:
        - anyone
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/json:
              examples:
                doc:
                  summary: Sunday's tools
                  value:
                    openapi: 3.1.0
                    info:
                      title: Agenda de Lemy
                      version: 2.0.0
              schema:
                type: object
                additionalProperties: {}
  /api/auth/session:
    get:
      operationId: getSession
      tags:
        - Auth
      summary: Current auth state of this browser
      description: |-
        Drives the first screen: setup, PIN keypad (with fingerprint when enabled) or the app.

        **Actors:** anyone (device-key cookie).
      security: []
      x-actors:
        - anyone (device-key cookie)
      responses:
        "200":
          description: State.
          content:
            application/json:
              examples:
                locked:
                  summary: Phone unused for 8 days
                  value:
                    state: locked
                    passkeyEnabled: true
                    lockedUntil: null
                    device:
                      id: 019a0a6e-1c00-7000-8000-000000000320
                      name: Galaxy S26 Ultra · Chrome
                    vapidPublicKey: BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U
                    timezone: America/Buenos_Aires
                setup:
                  summary: Fresh install
                  value:
                    state: setup_required
                    passkeyEnabled: false
                    lockedUntil: null
                    device: null
                    vapidPublicKey: null
                    timezone: America/Buenos_Aires
              schema:
                $ref: "#/components/schemas/SessionState"
  /api/auth/setup:
    post:
      operationId: setup
      tags:
        - Auth
      summary: First-run setup
      description: |-
        Only while no user exists; afterwards 409 `SETUP_COMPLETED`. Returns the 10 recovery codes once and trusts this device.

        **Actors:** anyone (device-key cookie).
      security: []
      x-actors:
        - anyone (device-key cookie)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            examples:
