      tags:
        - Tokens
      summary: Active API tokens
      description: "**Actors:** user."
      security:
        - session: []
      x-actors:
        - user
      responses:
        "200":
          description: Tokens (never the secrets).
          content:
            application/json:
              examples:
                list:
                  summary: Sunday's token
                  value:
                    tokens:
                      - id: 019a0a6e-1c00-7000-8000-000000000384
                        name: sunday
                        prefix: agd_x7Kp
                        scopes:
                          - read
                          - write
                          - notify
                        lastUsedAt: 2026-11-13T09:02:11.000-03:00
                        lastUsedIp: 203.0.113.7
                        expiresAt: null
                        createdAt: 2026-11-01T18:30:00.000-03:00
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiToken"
                required:
                  - tokens
                additionalProperties: false
        "401":
          description: "`UNAUTHORIZED` (no/invalid credentials) or `DEVICE_LOCKED` (unlock with PIN)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`FORBIDDEN` (API tokens can't call this) or `ORIGIN_NOT_ALLOWED` (cookie write from another origin)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createToken
      tags:
        - Tokens
      summary: Create an API token (shown once)
      description: |-
        Needs PIN or fingerprint confirmed in the last 5 minutes (`POST /api/auth/reauth`). Names are unique among active tokens.

        **Actors:** user.
      security:
        - session: []
      x-actors:
        - user
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              sunday:
                summary: Token for Sunday
                value:
                  name: sunday
                  scopes:
                    - read
                    - write
                    - notify
              reauth:
                summary: PIN not confirmed recently
                value:
                  name: sunday
                  scopes:
                    - read
            schema:
              $ref: "#/components/schemas/TokenCreateInput"
      responses:
        "201":
          description: Created; `token` is the secret, shown only now.
          content:
            application/json:
              examples:
                sunday:
                  summary: Token for Sunday
                  value:
                    id: 019a0a6e-1c00-7000-8000-000000000384
                    name: sunday
                    prefix: agd_x7Kp
                    scopes:
                      - read
                      - write
                      - notify
                    lastUsedAt: null
                    lastUsedIp: null
                    expiresAt: null
                    createdAt: 2026-11-01T18:30:00.000-03:00
                    token: agd_x7KpQ2mN8vR4tW6yZ1bC3dE5fG7hJ9kL0nP2qS4uV6w
              schema:
                $ref: "#/components/schemas/TokenCreated"
        "400":
          description: "`VALIDATION_ERROR` (details.fields)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "`UNAUTHORIZED` (no/invalid credentials) or `DEVICE_LOCKED` (unlock with PIN)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`REAUTH_REQUIRED`. `FORBIDDEN` (API tokens can't call this) or `ORIGIN_NOT_ALLOWED` (cookie write from another origin)."
          content:
            application/json:
              examples:
                reauth:
