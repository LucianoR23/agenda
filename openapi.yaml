    post:
      operationId: pushAction
      tags:
        - Push
      summary: Listo / Posponer from a notification (service worker)
      description: |-
        No session needed: the signed `actionToken` from the push payload (7 days) authorizes one action on that occurrence, once. Rate-limited per IP.

        **Actors:** anyone.
      security: []
      x-actors:
        - anyone
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              done:
                summary: Listo
                value:
                  token: eyJyIjoiMDE5YTBhNmUifQ.c2lnbmF0dXJl
                  action: done
              reused:
                summary: Second tap
                value:
                  token: eyJyIjoiMDE5YTBhNmUifQ.c2lnbmF0dXJl
                  action: done
            schema:
              $ref: "#/components/schemas/PushAction"
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              examples:
                done:
                  summary: Listo
                  value:
                    ok: true
                    action: done
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  action:
                    type: string
                    enum:
                      - done
                      - snooze
                required:
                  - ok
                  - action
                additionalProperties: false
        "400":
          description: "`VALIDATION_ERROR` (details.fields)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "`UNAUTHORIZED`: invalid or expired token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`NOT_FOUND`: no delivery for that occurrence."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`CONFLICT`: this notification's action was already used. `IDEMPOTENCY_IN_PROGRESS`."
          content:
            application/json:
              examples:
                reused:
                  summary: Second tap
                  value:
                    error:
                      code: CONFLICT
                      message: Esta notificación ya se usó.
                      requestId: req_01JA9X7Q2M8K
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "`UNSUPPORTED_MEDIA_TYPE`: send `Content-Type: application/json`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`IDEMPOTENCY_KEY_REUSE`: same `Idempotency-Key`, different body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`RATE_LIMITED`."
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
