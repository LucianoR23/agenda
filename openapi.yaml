        - title
        - notes
        - status
        - priority
        - dueDate
        - dueTime
        - dueAt
        - whenText
        - overdue
        - rrule
        - seriesId
        - completedAt
        - sortOrder
        - tags
        - source
        - url
        - version
        - createdAt
        - updatedAt
        - updatedBy
      additionalProperties: false
    TaskCreate:
      type: object
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
