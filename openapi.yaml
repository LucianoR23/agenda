              type: string
          required:
            - id
            - name
          additionalProperties: false
        vapidPublicKey:
          type:
            - string
            - "null"
          description: Web Push application server key; null when push is not configured.
        timezone:
          type: string
          description: The user's IANA timezone (every local date/time uses it).
          example: America/Buenos_Aires
      required:
        - state
        - passkeyEnabled
        - lockedUntil
        - device
        - vapidPublicKey
        - timezone
      additionalProperties: false
    Settings:
      type: object
      properties:
        timezone:
          type: string
          description: IANA timezone.
          example: America/Buenos_Aires
        locale:
          type: string
        quietStart:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: 23:30
          description: Quiet hours start (local). Non-urgent reminders wait until quietEnd.
        quietEnd:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: 23:30
        defaultSnoozeMinutes:
          type: integer
        missedAfterHours:
          type: integer
          description: A reminder later than this (server down) is marked missed instead of pushed.
      required:
        - timezone
        - locale
        - quietStart
        - quietEnd
        - defaultSnoozeMinutes
        - missedAfterHours
      additionalProperties: false
    SettingsPatch:
      type: object
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          type: string
          minLength: 2
          maxLength: 16
        quietStart:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: 23:30
        quietEnd:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: 23:30
        defaultSnoozeMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        missedAfterHours:
          type: integer
          minimum: 1
          maximum: 168
      additionalProperties: false
    SetupInput:
      type: object
      properties:
        setupCode:
          type: string
          minLength: 1
          maxLength: 200
        pin:
          $ref: "#/components/schemas/Pin"
        deviceName:
          type: string
          maxLength: 80
      required:
        - setupCode
        - pin
      additionalProperties: false
    SetupResult:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"
        recoveryCodes:
          type: array
          items:
            type: string
            pattern: ^[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$
          description: Shown once. Single use each.
      required:
        - device
        - recoveryCodes
      additionalProperties: false
    SleepEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - bed
            - wake
          description: '`bed` = "Me voy a dormir", `wake` = "Me levanté".'
        at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
            - description: 'Default now. Back-date: "me dormí a las 00:20".'
      required:
        - type
      additionalProperties: false
      description: "The night is resolved from the time: going to bed from noon on counts for the next day's row; waking up, for that day's."
    SleepLog:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        date:
          allOf:
            - $ref: "#/components/schemas/LocalDate"
            - description: "The **wake-up** date: bed Wed 23:30 → up Thu 07:10 is Thursday."
        bedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        wakeAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        durationMinutes:
          type:
            - integer
            - "null"
        quality:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 5
        notes:
          type:
            - string
            - "null"
        source:
          $ref: "#/components/schemas/ItemSource"
        version:
          type: integer
          minimum: 1
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        updatedBy:
          $ref: "#/components/schemas/ItemSource"
      required:
        - id
        - date
        - bedAt
        - wakeAt
        - durationMinutes
        - quality
        - notes
        - source
        - version
        - createdAt
        - updatedAt
        - updatedBy
      additionalProperties: false
    SleepUpsert:
      type: object
      properties:
        bedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        wakeAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        quality:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 5
        notes:
          type:
            - string
            - "null"
          maxLength: 1000
        version:
          type: integer
          minimum: 1
          description: Expected current version. Alternative to the `If-Match` header; mismatch → 409 `VERSION_CONFLICT`.
      additionalProperties: false
      description: Load or correct a night by hand. Not in the future; wake after bed; under 20 h.
    SnoozeInput:
      type: object
      properties:
        minutes:
          type: integer
          minimum: 1
          maximum: 10080
