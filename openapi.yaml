            maxLength: 40
            pattern: ^[^\s#]+$
          maxItems: 20
        status:
          type: string
          enum:
            - open
            - cancelled
          description: Use completeTask to mark done.
        version:
          type: integer
          minimum: 1
          description: Expected current version. Alternative to the `If-Match` header; mismatch → 409 `VERSION_CONFLICT`.
      additionalProperties: false
    TaskStatus:
      type: string
      enum:
        - open
        - done
        - cancelled
    TaskView:
      type: string
      enum:
        - inbox
        - today
        - upcoming
        - overdue
        - done
        - all
      description: "`inbox`: open, no date, in the Inbox. `today`: open, due today. `upcoming`: open, due after today. `overdue`: open, due before today. `done`: completed, newest first. `all`: no view filter."
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 timestamp with offset .
      example: 2026-10-19T07:00:12.345-03:00
    TokenCreated:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        prefix:
          type: string
          description: First 8 characters, for recognising the token.
          example: agd_x7Kp
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/TokenScope"
        lastUsedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        lastUsedIp:
          type:
            - string
            - "null"
        expiresAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        token:
          type: string
          description: The secret (`agd_…`). Shown only in this response.
          example: agd_x7Kp…
      required:
        - id
        - name
        - prefix
        - scopes
        - lastUsedAt
        - lastUsedIp
        - expiresAt
        - createdAt
        - token
      additionalProperties: false
    TokenCreateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/TokenScope"
          minItems: 1
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - name
        - scopes
      additionalProperties: false
    TokenScope:
      type: string
      enum:
        - read
        - write
        - notify
      description: "`read`: query the agenda. `write`: create/change items. `notify`: send pushes."
    UnlockInput:
      type: object
      properties:
        pin:
          $ref: "#/components/schemas/Pin"
        deviceName:
          type: string
          maxLength: 80
      required:
        - pin
      additionalProperties: false
    UnlockResult:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"
      required:
        - device
      additionalProperties: false
    Uuid:
      type: string
      format: uuid
      example: 019a0a6e-5c3e-7b2a-9d41-3f0c8a1b2c3d
    WebAuthnJson:
      type: object
      additionalProperties: {}
      description: "`PublicKeyCredential*OptionsJSON` or `*ResponseJSON` from @simplewebauthn (opaque here)."
  parameters:
    IdempotencyKey:
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
      required: false
      description: Same key + same body → stored response replayed; different body → 422. Kept 24 h, scoped per caller.
      name: Idempotency-Key
      in: header
    IfMatch:
      schema:
        $ref: "#/components/schemas/IfMatch"
      required: false
      description: Expected `version` as ETag (`"7"`). Mismatch → 409 `VERSION_CONFLICT` with the current resource.
      name: If-Match
      in: header
paths:
  /api/health:
    get:
      operationId: health
      tags:
        - Ops
      summary: Liveness/readiness (checks the DB)
      description: "**Actors:** anyone."
      security: []
      x-actors:
        - anyone
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              examples:
                ok:
                  summary: Healthy
                  value:
                    status: ok
                    db: ok
                    version: 0.1.0+a6ebbf4
                    time: 2026-10-19T07:00:00.000-03:00
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: DB unreachable.
          content:
            application/json:
              examples:
                down:
                  summary: DB down
                  value:
                    status: degraded
                    db: down
                    version: 0.1.0+a6ebbf4
                    time: 2026-10-19T07:00:00.000-03:00
              schema:
                $ref: "#/components/schemas/Health"
  /api/openapi.json:
    get:
      operationId: openapi
      tags:
        - Ops
      summary: This OpenAPI document
      description: |-
        Compact by default (no examples, ~115 KB). `?examples=true` returns the full document (~320 KB), identical to `openapi.yaml`.

        **Actors:** anyone.
      security: []
      x-actors:
        - anyone
      parameters:
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: examples
          in: query
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/json:
              examples:
                doc:
                  summary: The contract
                  value:
                    openapi: 3.1.0
                    info:
                      title: Agenda API
                      version: 1.0.0
              schema:
                type: object
                additionalProperties: {}
        "400":
          description: "`VALIDATION_ERROR` (details.fields)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/session:
    get:
      operationId: getSession
      tags:
        - Auth
      summary: Current auth state of this browser
      description: |-
        Drives the first screen: setup, PIN keypad (with fingerprint when enabled) or the app.

        **Actors:** anyone (device-key cookie).
      security: []
      x-actors:
        - anyone (device-key cookie)
      responses:
        "200":
          description: State.
          content:
            application/json:
              examples:
                locked:
                  summary: Phone unused for 8 days
                  value:
                    state: locked
                    passkeyEnabled: true
                    lockedUntil: null
                    device:
                      id: 019a0a6e-1c00-7000-8000-000000000320
                      name: Galaxy S26 Ultra · Chrome
                    vapidPublicKey: BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U
                    timezone: America/Buenos_Aires
                setup:
                  summary: Fresh install
                  value:
                    state: setup_required
                    passkeyEnabled: false
                    lockedUntil: null
                    device: null
                    vapidPublicKey: null
                    timezone: America/Buenos_Aires
              schema:
                $ref: "#/components/schemas/SessionState"
  /api/auth/setup:
    post:
      operationId: setup
      tags:
        - Auth
      summary: First-run setup
      description: |-
        Only while no user exists; afterwards 409 `SETUP_COMPLETED`. Returns the 10 recovery codes once and trusts this device.

        **Actors:** anyone (device-key cookie).
      security: []
      x-actors:
        - anyone (device-key cookie)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              setup:
                summary: Set PIN with the SETUP_CODE
                value:
                  setupCode: <SETUP_CODE>
                  pin: "482913"
                  deviceName: Galaxy S26 Ultra · Chrome
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: User created, device trusted.
          headers:
            Set-Cookie:
              description: "`agenda_session` (httpOnly, Secure, SameSite=Lax)."
              schema:
                type: string
          content:
            application/json:
              examples:
                setup:
                  summary: Set PIN with the SETUP_CODE
                  value:
                    device:
                      id: 019a0a6e-1c00-7000-8000-000000000320
                      name: Galaxy S26 Ultra · Chrome
                      userAgent: Mozilla/5.0 (Linux; Android 16; SM-S948B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Mobile Safari/537.36
                      current: true
                      passkeyEnabled: false
                      createdAt: 2026-10-01T09:12:00.000-03:00
                      lastSeenAt: 2026-10-19T07:41:30.000-03:00
                      lastUnlockAt: 2026-10-19T07:41:30.000-03:00
                    recoveryCodes:
                      - K7QM-2XPA-9TRC
                      - H3ZD-8WNB-4LFE
                      - P6VJ-5RYK-2MQS
                      - X9CA-7HTU-3NGE
                      - B4LR-6QWZ-8KDP
                      - M2FX-9JVA-5RHT
                      - T8NS-3PKC-7YWB
                      - E5GU-4ZMD-6XLQ
                      - R3WH-2BNF-9CAV
                      - Z7KP-8LTE-4SJM
              schema:
                $ref: "#/components/schemas/SetupResult"
        "400":
          description: "`VALIDATION_ERROR` (details.fields)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "`INVALID_CREDENTIALS`: wrong SETUP_CODE (counts toward lockout)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`SETUP_COMPLETED`. `IDEMPOTENCY_IN_PROGRESS`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "`UNSUPPORTED_MEDIA_TYPE`: send `Content-Type: application/json`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`IDEMPOTENCY_KEY_REUSE`: same `Idempotency-Key`, different body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/unlock:
    post:
      operationId: unlock
      tags:
        - Auth
      summary: Unlock / log in with PIN
      description: |-
        Trusts a new device or re-unlocks a locked one. 5 failures → locked 15 min, doubling per lockout (cap 24 h), per device and globally.

        **Actors:** anyone (device-key cookie).
      security: []
      x-actors:
        - anyone (device-key cookie)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              ok:
                summary: Correct PIN
                value:
                  pin: "482913"
              wrong:
                summary: Wrong PIN
                value:
                  pin: "111111"
              lockedOut:
                summary: 5th failure
                value:
                  pin: "222222"
            schema:
              $ref: "#/components/schemas/UnlockInput"
      responses:
        "200":
          description: Unlocked.
          headers:
            Set-Cookie:
              description: "`agenda_session` (httpOnly, Secure, SameSite=Lax)."
              schema:
                type: string
          content:
            application/json:
              examples:
                ok:
                  summary: Correct PIN
                  value:
                    device:
                      id: 019a0a6e-1c00-7000-8000-000000000320
                      name: Galaxy S26 Ultra · Chrome
                      userAgent: Mozilla/5.0 (Linux; Android 16; SM-S948B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Mobile Safari/537.36
                      current: true
                      passkeyEnabled: true
                      createdAt: 2026-10-01T09:12:00.000-03:00
                      lastSeenAt: 2026-10-19T07:41:30.000-03:00
                      lastUnlockAt: 2026-10-19T07:41:30.000-03:00
              schema:
                $ref: "#/components/schemas/UnlockResult"
        "400":
          description: "`VALIDATION_ERROR` (details.fields)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "`INVALID_CREDENTIALS` with `remainingAttempts`."
          content:
            application/json:
              examples:
                wrong:
                  summary: Wrong PIN
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: PIN incorrecto. Te quedan 3 intentos.
                      details:
                        remainingAttempts: 3
                      requestId: req_01JA9X7Q2M8K
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`IDEMPOTENCY_IN_PROGRESS`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "`UNSUPPORTED_MEDIA_TYPE`: send `Content-Type: application/json`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`IDEMPOTENCY_KEY_REUSE`: same `Idempotency-Key`, different body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`LOCKED_OUT` with `retryAfterSeconds`."
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/json:
              examples:
                lockedOut:
                  summary: 5th failure
                  value:
                    error:
                      code: LOCKED_OUT
                      message: Demasiados intentos fallidos. Probá de nuevo en 15 min, o usá un código de recuperación desde otro dispositivo.
                      details:
                        retryAfterSeconds: 900
                      requestId: req_01JA9X7Q2M8K
              schema:
                $ref: "#/components/schemas/Error"
