  /api/auth/reauth:
    post:
      operationId: reauth
      tags:
        - Auth
      summary: Confirm the PIN for a sensitive action
      description: |-
        Opens a 5-minute window for creating or revoking API tokens. A fingerprint unlock opens it too.

        **Actors:** user.
      security:
        - session: []
      x-actors:
        - user
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              ok:
                summary: PIN confirmed
                value:
                  pin: "482913"
            schema:
              $ref: "#/components/schemas/PinConfirmInput"
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              examples:
                ok:
                  summary: PIN confirmed
                  value:
                    validUntil: 2026-11-13T09:07:00.000-03:00
              schema:
                $ref: "#/components/schemas/ReauthResult"
        "400":
          description: "`VALIDATION_ERROR` (details.fields)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "`INVALID_CREDENTIALS` with `remainingAttempts`. `UNAUTHORIZED` (no/invalid credentials) or `DEVICE_LOCKED` (unlock with PIN)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`FORBIDDEN` (API tokens can't call this) or `ORIGIN_NOT_ALLOWED` (cookie write from another origin)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`IDEMPOTENCY_IN_PROGRESS`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "`UNSUPPORTED_MEDIA_TYPE`: send `Content-Type: application/json`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`IDEMPOTENCY_KEY_REUSE`: same `Idempotency-Key`, different body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`LOCKED_OUT`."
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
