              targetPeriod:
                $ref: "#/components/schemas/HabitPeriod"
              met:
                type: integer
              total:
                type: integer
              rate:
                type:
                  - number
                  - "null"
                minimum: 0
                maximum: 1
            required:
              - id
              - name
              - targetPeriod
              - met
              - total
              - rate
            additionalProperties: false
        sleep:
          type: object
          properties:
