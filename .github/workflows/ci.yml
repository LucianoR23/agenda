name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Schema ↔ migrations in sync
        run: pnpm db:check
      - name: Contract drift (examples valid, openapi.yaml + docs/api-examples.md up to date)
        run: pnpm openapi:check
      - run: pnpm openapi:lint
      - name: Icon sprite up to date
        run: pnpm icons:check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
          POSTGRES_DB: agenda_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U agenda" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://agenda:agenda@localhost:5434/agenda_test
      TZ: America/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit + API integration + contract tests (real Postgres 18)
        run: pnpm test:coverage
