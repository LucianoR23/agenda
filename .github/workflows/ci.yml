name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Biome (lint + format)
        run: pnpm check
      - name: Dependency audit
        run: pnpm audit
      - name: Schema ↔ migrations in sync
        run: pnpm db:check
      - name: Contract drift (examples valid, openapi.yaml up to date)
        run: pnpm openapi:check
      - run: pnpm openapi:lint
      - name: Icon sprite up to date
        run: pnpm icons:check
      - name: Production build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
          POSTGRES_DB: agenda_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda_test" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://agenda:agenda@localhost:5433/agenda_test
      TZ: America/Buenos_Aires
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (API integration tests return in phase 2)
        run: pnpm test:coverage

  # e2e job removed in phase 0 (v1 flows deleted); it returns with the first v2 screens.

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image for linux/arm64 (Oracle Ampere)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
