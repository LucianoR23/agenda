name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Schema ↔ migrations in sync
        run: pnpm db:check
      - name: Contract drift (examples valid, openapi.yaml + docs/api-examples.md up to date)
        run: pnpm openapi:check
      - run: pnpm openapi:lint
      - name: Icon sprite up to date
        run: pnpm icons:check
